function doneCount(){return parseInt(lsGet("storyspark_done","0"),10)||0}
function refreshStats(){const n=doneCount(),st=stars(),p=[];if(n)p.push(UI.done[lang].replace("{n}",n));if(st)p.push("⭐ "+st);say("stats",p.join(" · "))}
function isEnd(){return !!game&&(game.ai?!!game.done:game.step>=3)}
function recapTxt(){return "🧭 "+UI.path[lang]+": "+game.log.map(x=>x.choice).filter(Boolean).join(" → ")+"\n⭐⭐⭐"}
function post(){if(!game)return;const e=isEnd(),tot=game.total||(game.ai?AI_CHAPTERS:3),cur=Math.min(game.step+1,tot);say("chapter",(game.av||"")+" "+tr().chapter+" "+cur+"/"+tot+"  "+"●".repeat(cur)+"○".repeat(tot-cur));$("share").classList.toggle("hidden",!e);say("recap",e?recapTxt():"");$("art").innerHTML=ART[game.world]||"";{const st=$("story");st.classList.remove("fadein");void st.offsetWidth;st.classList.add("fadein")}playFor();if(e&&!game.fin){game.fin=1;lsSet("storyspark_done",doneCount()+1);refreshStats()}if(e)lsSet("storyspark_cur","");else if(!busy)lsSet("storyspark_cur",JSON.stringify(game))}
function resumeGame(){try{const g=JSON.parse(lsGet("storyspark_cur",""));if(!g||typeof g.id!=="string"||typeof g.hero!=="string"||!Number.isInteger(g.world)||g.world<0||g.world>4||!Number.isInteger(g.step)||g.step<0||g.step>9||!Array.isArray(g.log)||(g.ai&&!(g.cur&&typeof g.cur.text==="string"&&Array.isArray(g.cur.choices)&&typeof g.aiTitle==="string")))return;game=g;$("hero").value=g.hero;$("world").selectedIndex=g.world;$("setup").classList.add("hidden");$("game").classList.remove("hidden");drawGame()}catch(e){}}
async function shareStory(){if(!isEnd())return;let t=ttl(game)+"\n\n";game.log.forEach(e=>{t+=e.text+"\n";if(e.choice)t+="→ "+e.choice+"\n";t+="\n"});t+=recapTxt()+"\n\nStorySpark AI ✨";const nv=typeof navigator!=="undefined"?navigator:{};try{if(nv.share){await nv.share({title:ttl(game),text:t});return}}catch(e){if(e&&e.name==="AbortError")return}try{await nv.clipboard.writeText(t);say("notice",UI.copied[lang])}catch(e){}}

{id:"carousel",world:2,prem:false,t:{ru:"Тайна ночной карусели",en:"The Midnight Carousel"},c:{
ru:[["Ночью в парке сама собой заиграла музыка. {hero} подходит к старой карусели: деревянная лошадка тихонько кивает головой.","Погладить лошадку","Заглянуть под карусель","Позвать сторожа"],["Под каруселью лежит ржавый ключик с серебряной звёздочкой. Лошадка топает копытом, будто просит: «Поверни его!»","Вставить ключик в лошадку","Показать ключик сторожу","Спрятать ключик в карман"],["Карусель медленно кружится, и огоньки складываются в слова: «Верни нам песню». В центре тихо щёлкает маленькая музыкальная шкатулка.","Открыть шкатулку","Подпеть мелодии","Остановить карусель"],["Из шкатулки вылетают золотые ноты и садятся на гривы лошадок. Теперь карусель играет каждую ночь, а {hero} знает её тайну: музыка просыпается рядом с добрыми друзьями."]],
en:[["At night, music starts playing by itself in the park. {hero} walks up to the old carousel: a wooden horse nods its head ever so gently.","Pet the horse","Look under the carousel","Call the guard"],["Under the carousel lies a rusty key with a silver star. The horse stamps a hoof as if to say: “Turn it!”","Put the key in the horse","Show the key to the guard","Keep the key in a pocket"],["The carousel slowly spins and the lights spell out: “Bring back our song.” In the middle, a tiny music box clicks softly.","Open the music box","Hum along","Stop the carousel"],["Golden notes fly out of the music box and settle on the horses’ manes. Now the carousel plays every night, and {hero} knows its secret: music wakes up near kind friends."]]}},
{id:"clockland",world:1,prem:true,price:0.39,t:{ru:"Страна Часов",en:"The Land of Clocks"},c:{
ru:[["В полночь все часы в доме {hero} остановились разом. Только старые часы в коридоре тикают и приоткрывают крошечную дверцу. Из неё выглядывает мышонок в очках: «Время в Стране Часов сломалось! Только ты можешь помочь. Идём скорее, пока дверь не закрылась!»","Шагнуть в дверцу","Спросить, кто он такой","Взять с собой фонарик"],["За дверцей раскинулся город из шестерёнок. Улицы тикают, а дома кружатся, как огромные юлы. Мышонок Тик объясняет: «У Главных Часов пропала Золотая Стрелка. Без неё время стоит на месте». Вдали видны три башни: медная, стеклянная и совсем крошечная.","Идти к медной башне","Идти к стеклянной башне","Зайти в крошечную башню"],["Хранитель башни — старый часовщик с бородой из пружинок. Он прищуривается: «Золотую Стрелку унёс Ветер Минут, он обожает загадки. Победишь его в игре, и она твоя». Вокруг вздрагивают стрелки: они очень надеются на тебя.","Согласиться на игру","Попросить подсказку","Рассмешить часовщика"],["Ветер Минут оказывается маленьким вихрем, который играет в прятки. Он шепчет: «Найди меня за три тика!» Тик нервно крутит усы. Вокруг пляшут листки календаря, и один из них вдруг светится золотом.","Поймать золотой листок","Прислушаться к шороху","Позвать Ветер по имени"],["Ты слышишь тихое «тик-тик» и понимаешь: Ветер спрятался в часах с кукушкой! Кукушка выглядывает и виновато улыбается. В её руках блестит Золотая Стрелка. Ветер хихикает: «Я просто хотел, чтобы со мной кто-нибудь поиграл!»","Поиграть с Ветром","Вежливо забрать стрелку","Пригласить Ветер в город"],["Золотая Стрелка встаёт на место, и вся страна оживает: башни звонят, шестерёнки поют, а Ветер Минут кружит над городом, больше не одинокий. Тик салютует: «Ты спас время!» Дома, у часов в коридоре, {hero} находит золотую пружинку на память. А утром часы снова тикают, и каждый тик звучит как «спасибо»."]],
en:[["At midnight, every clock in {hero}’s house stopped at once. Only the old hallway clock keeps ticking and opens a tiny door. A mouse in glasses peeks out: “Time in the Land of Clocks is broken! Only you can help. Hurry, before the door closes!”","Step through the door","Ask who he is","Take a flashlight along"],["Behind the door lies a city of gears. The streets tick and the houses spin like giant tops. The mouse, Tick, explains: “The Great Clock lost its Golden Hand. Without it, time stands still.” In the distance rise three towers: copper, glass, and a very tiny one.","Go to the copper tower","Go to the glass tower","Enter the tiny tower"],["The tower keeper is an old clockmaker with a beard made of springs. He squints: “The Golden Hand was taken by the Minute Wind, who loves riddles. Beat it at a game and the hand is yours.” All around, clock hands tremble: they are counting on you.","Agree to the game","Ask for a hint","Make the clockmaker laugh"],["The Minute Wind turns out to be a little whirlwind playing hide-and-seek. It whispers: “Find me in three ticks!” Tick nervously twirls his whiskers. Calendar pages dance around, and one of them suddenly glows gold.","Catch the golden page","Listen for a rustle","Call the Wind by name"],["You hear a soft “tick-tick” and realize: the Wind is hiding in the cuckoo clock! The cuckoo peeks out with a guilty smile, holding the shining Golden Hand. The Wind giggles: “I just wanted someone to play with!”","Play with the Wind","Politely take the hand","Invite the Wind to the city"],["The Golden Hand clicks into place and the whole land wakes up: towers chime, gears sing, and the Minute Wind swirls over the city, no longer lonely. Tick salutes: “You saved time!” At home, by the hallway clock, {hero} finds a tiny golden spring as a keepsake. By morning the clocks are ticking again, and every tick sounds like “thank you.”"]]}},
{id:"star_gardener",world:0,prem:false,t:{ru:"Звёздный садовник",en:"The Star Gardener"},c:{ru:[["На маленькой планете {hero} находит сад, где вместо цветов растут звёзды. Но половина звёзд погасла, а садовник-астероид Пых грустно вздыхает.", "Полить погасшие звёзды", "Спросить Пыха, что случилось", "Осмотреть сад"], ["Пых рассказывает: звёзды любят песни, а он давно разучился петь. Рядом звенит лейка с лунным светом.", "Взять лунную лейку", "Спеть звёздам песню", "Научить Пыха напевать"], ["Одна звезда мигает и загорается ярче. За ней вспыхивает вторая, третья! Но в центре сада остаётся самый большой бутон, закрытый и тихий.", "Подуть на бутон", "Прошептать ему доброе слово", "Оставить рядом лунный свет"], ["Бутон раскрывается, и сад заливает тёплый свет. Пых поёт вместе с {hero}. Теперь каждую ночь над планетой появляется новое созвездие — Созвездие Друзей."]],en:[["On a tiny planet, {hero} finds a garden where stars grow instead of flowers. Half of them have gone dark, and the asteroid gardener Puff sighs sadly.", "Water the dark stars", "Ask Puff what happened", "Look around the garden"], ["Puff explains that stars love songs, and he forgot how to sing long ago. A watering can full of moonlight jingles nearby.", "Take the moonlight can", "Sing the stars a song", "Teach Puff to hum"], ["One star blinks and glows brighter. Then a second lights up, then a third! But the biggest bud in the middle stays closed and quiet.", "Blow on the bud", "Whisper a kind word", "Leave some moonlight beside it"], ["The bud opens and warm light floods the garden. Puff sings along with {hero}. Now every night a new constellation appears above the planet: the Constellation of Friends."]]}},
{id:"comet_mail",world:0,prem:false,t:{ru:"Кометная почта",en:"Comet Mail"},c:{ru:[["На станции «Хвост» {hero} работает почтальоном. Сегодня на стол упало странное письмо без адреса, только маленькая звёздочка вместо марки.", "Рассмотреть звёздочку", "Вскрыть письмо", "Спросить у кометы-курьера"], ["Комета Фьють шепчет: письмо нужно доставить до рассвета на Планету Эхо. Но впереди три туманности — розовая, серая и пёстрая.", "Лететь через розовую", "Лететь через серую", "Лететь через пёструю"], ["В тумане корабль почтальона тихо звенит. Из облака выглядывает маленький пришелец: «Это моё письмо! Я потерял его вчера!»", "Отдать письмо сразу", "Спросить, кому оно написано", "Попросить показать, что внутри"], ["Пришелец читает письмо вслух: это приглашение на день рождения от друга с Планеты Эхо. {hero} доставляет обоих до рассвета, и на празднике почтальону достаётся самый большой кусок звёздного торта."]],en:[["{hero} works as a mail carrier at Tail Station. Today a strange letter lands on the desk with no address, just a tiny star instead of a stamp.", "Look at the star", "Open the letter", "Ask the comet courier"], ["The comet Whoosh whispers that the letter must reach Planet Echo by sunrise. But three nebulas lie ahead: a pink one, a gray one, and a spotted one.", "Fly through the pink one", "Fly through the gray one", "Fly through the spotted one"], ["In the mist, the mail ship starts to jingle softly. A little alien peeks out of the cloud: “That’s my letter! I lost it yesterday!”", "Hand over the letter", "Ask who it is for", "Ask to see what’s inside"], ["The alien reads it aloud: it is a birthday invitation from a friend on Planet Echo. {hero} delivers them both by sunrise, and at the party the mail carrier gets the biggest slice of star cake."]]}},
{id:"lost_moon",world:0,prem:false,t:{ru:"Потерянная луна",en:"The Lost Moon"},c:{ru:[["Ночью {hero} замечает, что одна из лун пропала с неба. Осталась только тёмная дырка, а где-то вдали тихо плачет кто-то маленький.", "Полететь на звук", "Включить телескоп", "Позвать капитана"], ["Плач доносится с кометы. Там сидит крошечная луна и дрожит: «Я заблудилась. Тут так темно, а моя мама-планета далеко».", "Укутать луну в плед", "Показать дорогу по карте", "Предложить ей фонарик"], ["Луна просит вернуть её домой. Но путь лежит через Кольца Тишины, где нельзя говорить громко.", "Лететь молча", "Говорить шёпотом", "Показывать знаки руками"], ["Планета-мама обнимает свою луну лучами света. С тех пор по ночам лунный свет чуть мигает — это луна машет {hero}, своему лучшему другу."]],en:[["One night {hero} notices that one of the moons has vanished from the sky. Only a dark gap is left, and somewhere far away someone small is crying softly.", "Fly toward the sound", "Turn on the telescope", "Call the captain"], ["The crying comes from a comet. A tiny moon sits there, trembling: “I got lost. It’s so dark here, and my mother planet is far away.”", "Wrap the moon in a blanket", "Show the way on the map", "Offer a flashlight"], ["The moon asks to go home. But the way leads through the Rings of Silence, where no one may speak loudly.", "Fly in silence", "Speak in whispers", "Use hand signs"], ["The mother planet hugs her moon with beams of light. Since then, moonlight twinkles a little at night: it is the moon waving to {hero}, its best friend."]]}},
{id:"dark_robot",world:0,prem:false,t:{ru:"Робот, который боялся темноты",en:"The Robot Afraid of the Dark"},c:{ru:[["Маленький робот Тик боится темноты и всегда спит с включённой лампочкой. Сегодня на корабле, где живёт {hero}, вдруг гаснет свет.", "Взять Тика за руку", "Включить фонарик", "Спросить, чего он боится"], ["Тик шепчет: «В темноте живёт страшная тень!» На стене что-то шевелится. Оно большое, с ушами и хвостом.", "Посветить на тень", "Бросить игрушку", "Помахать тени"], ["Оказывается, это тень самого Тика, когда он поднимает руку! Она повторяет все его движения, как послушный друг.", "Потанцевать с тенью", "Показать тени фокус", "Спросить, как её зовут"], ["Тик смеётся электрическим смехом и выключает лампочку. Теперь темнота для него как одеяло, а {hero} получает звание «Друг маленьких храбрецов»."]],en:[["The little robot Tik is afraid of the dark and always sleeps with a lamp on. Tonight the lights suddenly go out on the ship where {hero} lives.", "Hold Tik’s hand", "Switch on a flashlight", "Ask what Tik is afraid of"], ["Tik whispers: “A scary shadow lives in the dark!” Something moves on the wall. It is big, with ears and a tail.", "Shine a light on it", "Toss a toy", "Wave at the shadow"], ["It turns out to be Tik’s own shadow when he raises his arm! It copies every move like an obedient friend.", "Dance with the shadow", "Show it a magic trick", "Ask for its name"], ["Tik laughs an electric laugh and switches off the lamp. Now the dark feels like a blanket, and {hero} earns the title “Friend of Little Brave Ones.”"]]}},
{id:"dragon_librarian",world:1,prem:false,t:{ru:"Дракон-библиотекарь",en:"The Dragon Librarian"},c:{ru:[["В замке Тихих Страниц живёт дракон, хранитель всех книг. Сегодня книги вылетают с полок и кружатся под потолком, а {hero} стоит в дверях.", "Поймать книжку", "Позвать дракона", "Спрятаться под столом"], ["Дракон Фолиант чихает дымком: «Я чихнул от пыли, и буквы разбежались!» Из книг сыплются бессвязные слова.", "Собирать буквы в мешок", "Попросить Фолианта подышать теплом", "Расставить книги по цветам"], ["Буквы собираются в светящуюся стайку и просят: «Верни нас в нужные слова!» Перед тобой лежит пустая книга.", "Записать первую историю", "Прочитать вслух", "Сыграть с буквами в слова"], ["Буквы выстраиваются в строчки и превращаются в новую сказку — про дракона и его друга {hero}. Фолиант ставит её на самую почётную полку."]],en:[["In the Castle of Quiet Pages lives a dragon who guards all the books. Today the books fly off the shelves and swirl under the ceiling while {hero} stands in the doorway.", "Catch a book", "Call the dragon", "Hide under the table"], ["The dragon Folio sneezes out a puff of smoke: “Dust made me sneeze, and the letters ran away!” Jumbled words rain from the books.", "Gather letters in a sack", "Ask Folio to breathe warmth", "Sort books by color"], ["The letters gather into a glowing flock and beg: “Put us back into the right words!” An empty book lies in front of you.", "Write the first story", "Read aloud", "Play a word game with the letters"], ["The letters line up and turn into a brand-new tale about a dragon and his friend {hero}. Folio places it on the most honored shelf."]]}},
{id:"morning_potion",world:1,prem:false,t:{ru:"Зелье доброго утра",en:"The Good Morning Potion"},c:{ru:[["Утренний волшебник Мур заболел, и теперь в королевстве никто не может проснуться. Даже петухи спят на заборах. {hero} входит в его лавку зелий.", "Посмотреть на полки", "Разбудить волшебника", "Найти рецепт"], ["В рецепте сказано: «Три капли солнца, щепотка смеха и один тёплый блин». Но все баночки перепутаны.", "Искать капли солнца", "Искать смех", "Попросить помощи у кота Мура"], ["Кот приносит золотую пипетку, а смех оказывается в пузырьке, который хихикает сам. Зелье закипает и пахнет блинами.", "Размешать по часовой стрелке", "Добавить блин", "Попробовать на кончик ложки"], ["Золотой пар поднимается над крышами. Петухи кукарекают, жители потягиваются, а Мур просыпается и угощает всех блинами. «Лучший помощник за всю историю!» — говорит он {hero}."]],en:[["The Morning Wizard Mur is sick, and now nobody in the kingdom can wake up. Even the roosters snooze on the fences. {hero} steps into his potion shop.", "Look at the shelves", "Wake the wizard", "Search for the recipe"], ["The recipe says: “Three drops of sunshine, a pinch of laughter, and one warm pancake.” But all the little jars are mixed up.", "Look for the sunshine drops", "Look for the laughter", "Ask Mur’s cat for help"], ["The cat brings a golden dropper, and the laughter turns out to be in a bottle that giggles by itself. The potion bubbles and smells like pancakes.", "Stir clockwise", "Add the pancake", "Taste a drop"], ["Golden steam rises over the rooftops. Roosters crow, people stretch, and Mur wakes up and treats everyone to pancakes. “The best helper in history!” he tells {hero}."]]}},
{id:"rainbow_bridge",world:1,prem:false,t:{ru:"Радужный мост",en:"The Rainbow Bridge"},c:{ru:[["После дождя над рекой появляется радужный мост, но на нём не хватает одного цвета — зелёного. {hero} видит, как по мосту грустно ходит гномик.", "Подойти к гномику", "Рассмотреть мост", "Позвать ветерок"], ["Гномик Бим объясняет: «Зелёный украл Ворчливый Дождик. Он говорит, что цветов слишком много». Его тучка висит над лесом.", "Идти к тучке", "Спросить совета у лягушки", "Взять зонтик"], ["Дождик ворчит: «Всем нравится красный и жёлтый, а про зелёный забывают!» Ему просто хочется, чтобы его заметили.", "Похвалить зелёный цвет", "Показать ему листья", "Предложить дружить"], ["Дождик улыбается, и зелёная полоса возвращается на мост. Теперь он всегда прикрывает радугу ласковым дождиком, а гномик Бим дарит {hero} зелёный листик на счастье."]],en:[["After the rain, a rainbow bridge appears over the river, but one color is missing: green. {hero} sees a little gnome pacing sadly on the bridge.", "Walk up to the gnome", "Look at the bridge", "Call the breeze"], ["The gnome Bim explains: “Grumpy Drizzle stole the green. He says there are too many colors.” His little cloud hangs over the forest.", "Head to the cloud", "Ask the frog for advice", "Bring an umbrella"], ["Drizzle grumbles: “Everyone likes red and yellow, and they forget about green!” He only wants to be noticed.", "Praise the color green", "Show him the leaves", "Offer to be friends"], ["Drizzle smiles, and the green stripe returns to the bridge. Now he always covers the rainbow with gentle rain, and Bim gives {hero} a green leaf for luck."]]}},
{id:"talking_mushroom",world:1,prem:false,t:{ru:"Говорящий гриб",en:"The Talking Mushroom"},c:{ru:[["В Туманном лесу {hero} слышит чьё-то шмыганье. Под ёлкой сидит гриб в красной шляпке и говорит тоненьким голосом: «Я потерял свои пятнышки!»", "Посчитать оставшиеся", "Поискать пятнышки в траве", "Спросить, как он их потерял"], ["Гриб Бубо рассказывает: пятнышки сдуло ветром, пока он спал. Они упали куда-то к ручью.", "Идти к ручью", "Позвать белку", "Сделать новые из глины"], ["У ручья пятнышки плавают, как белые лепестки. А рядом маленькая лягушка пытается их ловить для своей кувшинки.", "Помочь ей выловить", "Попросить поделиться", "Придумать, как всем хватит"], ["Половину пятнышек Бубо возвращает себе, а половину дарит лягушке. Теперь в лесу два самых нарядных друга, а {hero} получает в подарок шапочку из мха."]],en:[["In the Foggy Forest, {hero} hears a sniffle. Under a fir tree sits a mushroom with a red cap, and it says in a tiny voice: “I lost my spots!”", "Count the spots left", "Look for spots in the grass", "Ask how he lost them"], ["The mushroom Bubo says the wind blew his spots away while he slept. They landed somewhere near the stream.", "Walk to the stream", "Call the squirrel", "Make new ones from clay"], ["By the stream the spots float like white petals. Next to them, a little frog is trying to catch them for her lily pad.", "Help her fish them out", "Ask her to share", "Find a way for everyone to have some"], ["Bubo takes back half of his spots and gives half to the frog. Now the forest has two of the most stylish friends, and {hero} receives a little moss hat."]]}},
{id:"vanishing_drawing",world:2,prem:false,t:{ru:"Исчезнувший рисунок",en:"The Vanishing Drawing"},c:{ru:[["На уроке рисования исчез рисунок {hero}: на листе остался только блестящий след. По полу тянется дорожка из разноцветных точек.", "Идти по точкам", "Осмотреть лист", "Спросить учителя"], ["Дорожка приводит к шкафу с красками. Оттуда слышится шёпот: «Не включай свет!» Дверца чуть приоткрыта.", "Заглянуть внутрь", "Тихо постучать", "Прислушаться"], ["В шкафу сидит маленький художник-невидимка. Он обожает рисунки и забирает самые красивые, чтобы согреться их красками.", "Попросить вернуть рисунок", "Предложить нарисовать вместе", "Подарить ему краски"], ["Невидимка возвращает рисунок и просит рисовать для него новые. С тех пор в углу шкафа лежит рисунок «для друга», а {hero} знает: самые таинственные воришки обычно просто одиноки."]],en:[["During art class, {hero}’s drawing vanishes: only a shiny trail is left on the paper. A path of colorful dots leads across the floor.", "Follow the dots", "Examine the paper", "Ask the teacher"], ["The path leads to the paint cupboard. A whisper comes out: “Don’t turn on the light!” The door is slightly open.", "Peek inside", "Knock quietly", "Listen closely"], ["Inside sits a tiny invisible artist. He loves drawings and takes the prettiest ones to warm himself with their colors.", "Ask for the drawing back", "Offer to draw together", "Give him some paints"], ["The invisible artist returns the drawing and asks for new ones. Now a drawing “for a friend” always lies in the corner of the cupboard, and {hero} knows that the most mysterious thieves are usually just lonely."]]}},
{id:"school_bell",world:2,prem:false,t:{ru:"Загадка школьного звонка",en:"The Riddle of the School Bell"},c:{ru:[["Утром школьный звонок не прозвенел, и все ходят растерянные. {hero} замечает, что колокольчик на двери подмигивает.", "Подойти к колокольчику", "Спросить завуча", "Заглянуть в коридор"], ["Колокольчик шепчет: «У меня пропал язычок!» Без него звонок не звенит. Рядом валяется ленточка.", "Идти по ленточке", "Проверить спортзал", "Заглянуть в столовую"], ["Ленточка ведёт в столовую, где кот Пончик играет блестящим язычком. Он подкидывает его лапой, будто мячик.", "Предложить обмен на косточку", "Отвлечь шуршащим пакетом", "Тихо взять язычок"], ["Язычок снова на месте, и звонок звенит звонче прежнего. Все бегут на урок, а {hero} получает звание Главного Хранителя Звонка."]],en:[["In the morning the school bell does not ring, and everyone wanders around confused. {hero} notices the little bell on the door winking.", "Walk up to the bell", "Ask the principal", "Look into the hallway"], ["The bell whispers: “My clapper is missing!” Without it, the bell cannot ring. A ribbon lies nearby.", "Follow the ribbon", "Check the gym", "Peek into the cafeteria"], ["The ribbon leads to the cafeteria, where the cat Donut is playing with the shiny clapper. He tosses it around like a ball.", "Offer a bone in exchange", "Distract him with a rustling bag", "Quietly take the clapper"], ["The clapper is back in place, and the bell rings louder than ever. Everyone hurries to class, and {hero} receives the honorary title Chief Keeper of the Bell."]]}},
{id:"attic_secret",world:2,prem:false,t:{ru:"Чердак с секретом",en:"The Attic Secret"},c:{ru:[["На чердаке бабушкиного дома {hero} находит старый сундук. На крышке нарисованы три знака, а изнутри доносится тихое «тик-так».", "Рассмотреть знаки", "Потрясти сундук", "Позвать бабушку"], ["Бабушка улыбается: «Это сундук-загадка. Ответ спрятан в моей любимой песне». На стене висит гитара без струн.", "Напеть мелодию", "Поискать струны", "Осмотреть гитару"], ["Внутри гитары спрятаны ноты. Когда {hero} напевает их, знаки на сундуке по очереди загораются, и замок щёлкает.", "Открыть крышку", "Позвать бабушку", "Спеть ещё раз"], ["Внутри лежат часы и письмо: «Время дороже золота — проводи его с теми, кого любишь». Бабушка обнимает {hero}, и они вместе пьют чай."]],en:[["In the attic of Grandma’s house, {hero} finds an old chest. Three symbols are painted on the lid, and a quiet “tick-tock” comes from inside.", "Study the symbols", "Shake the chest", "Call Grandma"], ["Grandma smiles: “This is a riddle chest. The answer is hidden in my favorite song.” A guitar without strings hangs on the wall.", "Hum the tune", "Look for strings", "Examine the guitar"], ["Sheet music is hidden inside the guitar. When {hero} hums it, the symbols on the chest light up one by one, and the lock clicks.", "Open the lid", "Call Grandma", "Hum it once more"], ["Inside lie a pocket watch and a letter: “Time is worth more than gold. Spend it with those you love.” Grandma hugs {hero}, and they drink tea together."]]}},
{id:"snow_footprints",world:2,prem:false,t:{ru:"Следы на снегу",en:"Footprints in the Snow"},c:{ru:[["Утром во дворе выпал первый снег. На нём — цепочка маленьких следов, которая обрывается посреди двора. {hero} задумчиво чешет затылок.", "Присмотреться к следам", "Пойти по следам назад", "Позвать друга"], ["Следы ведут не к дому, а к старой яблоне. На ветке висит шарфик с вышитой снежинкой.", "Взять шарфик", "Залезть на яблоню", "Позвать собаку"], ["Из дупла выглядывает маленький снегирь: «Это мой шарфик! Вчера ветер унёс его, а следы мои — я прыгал по снегу и искал».", "Вернуть шарфик", "Согреть снегиря в варежке", "Построить ему домик"], ["Снегирь надевает шарфик и громко чирикает от радости. Теперь по утрам он поёт под окном у {hero}, а на снегу остаются только следы счастливой птички."]],en:[["The first snow falls in the yard this morning. A chain of tiny footprints stops in the middle of the yard. {hero} scratches their head thoughtfully.", "Study the prints", "Follow them backward", "Call a friend"], ["The footprints lead not to the house but to an old apple tree. A little scarf with an embroidered snowflake hangs on a branch.", "Take the scarf", "Climb the tree", "Call the dog"], ["A small bullfinch peeks out of the hollow: “That’s my scarf! The wind took it yesterday, and the footprints are mine. I hopped through the snow looking for it.”", "Return the scarf", "Warm the bird in a mitten", "Build it a little house"], ["The bullfinch puts on the scarf and chirps with joy. Now it sings under {hero}’s window every morning, and only the prints of a happy little bird remain on the snow."]]}},
{id:"turtle_pearl",world:3,prem:false,t:{ru:"Жемчужина морской черепахи",en:"The Turtle’s Pearl"},c:{ru:[["На дне тёплой бухты {hero} встречает морскую черепаху Тортилу. Она плачет: «Моя жемчужина удачи пропала, а без неё мне не найти дорогу домой».", "Утешить Тортилу", "Осмотреть дно", "Позвать рыбок на помощь"], ["Рыбка-клоун говорит, что видела что-то блестящее у Кораллового Замка. Там живёт хитрая каракатица.", "Плыть к замку", "Идти по следу ракушек", "Взять с собой подарок"], ["Каракатица показывает жемчужину: «Я её только отполировала! Она была тусклая». И правда, жемчужина сияет ярче, но на ней появилась трещинка.", "Поблагодарить каракатицу", "Предложить склеить жемчужину", "Спросить, зачем она это сделала"], ["Тортила получает жемчужину с золотой ниточкой на трещинке. Она находит дорогу домой, а {hero} получает ракушку, в которой всегда шумит море."]],en:[["At the bottom of a warm bay, {hero} meets the sea turtle Tortilla. She is crying: “My lucky pearl is gone, and without it I can’t find my way home.”", "Comfort Tortilla", "Search the seabed", "Ask the little fish for help"], ["A clownfish says it saw something shiny near the Coral Castle. A sly cuttlefish lives there.", "Swim to the castle", "Follow the trail of shells", "Bring a gift"], ["The cuttlefish shows the pearl: “I only polished it! It was dull.” It’s true, the pearl shines brighter, but now it has a tiny crack.", "Thank the cuttlefish", "Offer to glue the pearl", "Ask why she did it"], ["Tortilla gets her pearl back with a golden thread on the crack. She finds her way home, and {hero} receives a shell in which the sea always murmurs."]]}},
{id:"whale_song",world:3,prem:false,t:{ru:"Песня кита",en:"The Whale’s Song"},c:{ru:[["Над океаном стоит тишина: кит по имени Бом, который всегда пел по утрам, молчит. {hero} подплывает к нему на маленькой лодке.", "Погладить кита", "Спросить, что случилось", "Послушать тишину"], ["Бом шепчет: «Я забыл слова песни, и теперь рыбки не засыпают». Вокруг кружатся сонные медузы.", "Напомнить мелодию", "Предложить новую песню", "Попросить медуз подсказать"], ["Медузы светятся, и в их свете складываются ноты. Мелодия приходит издалека, как эхо.", "Напевать вместе", "Играть на ракушке", "Хлопать в такт волнам"], ["Бом запевает, и вся бухта засыпает под колыбельную. На прощание он выпускает фонтан в форме сердца — специально для {hero}."]],en:[["A hush hangs over the ocean: the whale Boom, who always sang in the mornings, is silent. {hero} rows up to him in a little boat.", "Pat the whale", "Ask what happened", "Listen to the silence"], ["Boom whispers: “I forgot the words of my song, and now the fish can’t fall asleep.” Sleepy jellyfish drift around.", "Remind him of the tune", "Suggest a new song", "Ask the jellyfish for hints"], ["The jellyfish glow, and their light forms musical notes. A melody arrives from far away, like an echo.", "Hum along", "Play a seashell", "Clap to the waves"], ["Boom begins to sing, and the whole bay falls asleep to the lullaby. As a goodbye he sends up a heart-shaped spout, just for {hero}."]]}},
{id:"sunken_ship",world:3,prem:false,t:{ru:"Затонувший корабль",en:"The Sunken Ship"},c:{ru:[["На дне океана лежит старый корабль «Звёздочка». {hero} в маленьком батискафе замечает в иллюминаторе свет и чью-то тень.", "Подплыть ближе", "Выключить фары", "Позвать по радио"], ["Свет идёт от лампы в каюте капитана. Там сидит краб-капитан и читает карту, перевернув её вверх ногами.", "Помочь с картой", "Постучать в иллюминатор", "Осмотреть каюту"], ["Карта показывает, где зарыт «самый большой клад». Крабик мечтает его найти, но боится идти один.", "Пойти вместе", "Придумать план", "Спросить дорогу у рыбки"], ["Клад оказывается сундучком с ракушками из разных стран и надписью «Друзьям всех морей». Краб и {hero} берут по ракушке и обещают вернуться."]],en:[["On the ocean floor lies an old ship called the Little Star. From a tiny submarine, {hero} spots a light in the porthole and someone’s shadow.", "Swim closer", "Turn off the headlights", "Call on the radio"], ["The light comes from a lamp in the captain’s cabin. A crab captain sits there reading a map upside down.", "Help with the map", "Knock on the porthole", "Look around the cabin"], ["The map shows where the “biggest treasure” is buried. The little crab dreams of finding it but is afraid to go alone.", "Go together", "Make a plan", "Ask a fish for directions"], ["The treasure is a small chest of shells from many lands, with a note: “For friends of all seas.” The crab and {hero} each take one shell and promise to come back."]]}},
{id:"octopus_painter",world:3,prem:false,t:{ru:"Осьминог-художник",en:"The Octopus Painter"},c:{ru:[["В подводной галерее рисует осьминог Октавио. В щупальцах у него восемь кисточек, но картины выходят серыми. {hero} грустно разглядывает холсты.", "Спросить об этом", "Выбрать картину", "Предложить краски"], ["Октавио вздыхает: «Мои краски унесло течением». У него осталась только капелька синей и капелька жёлтой.", "Смешать капельки", "Поискать краски в рифе", "Попросить у медуз"], ["Смесь даёт зелёный, и осьминог оживает. Он водит кисточками по холсту — и появляются водоросли, рыбки и маленький краб с зонтиком.", "Дорисовать солнце", "Нарисовать себя", "Подписать картину"], ["Галерея заполняется яркими картинами, а Октавио вешает самую красивую у входа: портрет {hero} с кистью в руке. Подпись: «Мой первый друг-художник»."]],en:[["In an underwater gallery paints the octopus Octavio. He holds eight brushes, but his pictures all come out gray. {hero} looks at the canvases sadly.", "Ask about it", "Pick a painting", "Offer some paints"], ["Octavio sighs: “The current swept my paints away.” He only has a drop of blue and a drop of yellow left.", "Mix the drops", "Search the reef for paint", "Ask the jellyfish"], ["The mixture makes green, and the octopus comes alive. He swishes his brushes across the canvas and seaweed, fish, and a little crab with an umbrella appear.", "Paint a sun", "Paint yourself", "Sign the picture"], ["The gallery fills with bright paintings, and Octavio hangs the best one by the entrance: a portrait of {hero} holding a brush. The caption reads: “My first artist friend.”"]]}},
{id:"dino_egg",world:4,prem:false,t:{ru:"Яйцо на вершине холма",en:"The Egg on the Hilltop"},c:{ru:[["На вершине холма {hero} находит большое пятнистое яйцо. Оно тёплое и тихонько покачивается. Вокруг никого, только следы огромной лапы.", "Приложить ухо к яйцу", "Позвать маму-динозавра", "Накрыть яйцо листом"], ["Из-за пальм выглядывает динозаврик Топ и вздыхает: «Это яйцо моей сестрёнки! Мама ушла за едой, а мне велела его охранять».", "Предложить помощь", "Спросить про маму", "Построить гнёздышко"], ["Начинается дождь. Яйцо дрожит и трескается! Топ и {hero} быстро накрывают его огромным листом папоротника.", "Греть яйцо ладонями", "Петь колыбельную", "Позвать маму"], ["Из скорлупы вылупляется малышка в зелёную крапинку. Мама возвращается с охапкой плодов и благодарно кивает {hero}. Теперь у холма появился ещё один друг."]],en:[["On top of a hill, {hero} finds a large spotted egg. It is warm and gently rocking. No one is around, only the tracks of a huge paw.", "Press an ear to the egg", "Call for the mother dinosaur", "Cover the egg with a leaf"], ["A baby dinosaur named Top peeks from behind the palms and sighs: “That’s my little sister’s egg! Mom went to find food and told me to guard it.”", "Offer to help", "Ask about his mom", "Build a little nest"], ["Rain begins. The egg trembles and cracks! Top and {hero} quickly cover it with a giant fern leaf.", "Warm the egg with your hands", "Sing a lullaby", "Call the mother"], ["A little one with green speckles hatches. Mom returns with an armful of fruit and nods gratefully at {hero}. Now the hill has one more friend."]]}},
{id:"no_roar",world:4,prem:false,t:{ru:"Динозавр, который не умел рычать",en:"The Dino Who Couldn’t Roar"},c:{ru:[["Динозавр Рык-Рык очень хочет рычать, как папа, но из его пасти выходит только тихое «пи-пи». Все смеются, и он прячется за папоротником.", "Подойти к Рык-Рыку", "Сказать что-нибудь доброе", "Позвать других динозавров"], ["{hero} спрашивает: «А ты пробовал петь?» Рык-Рык никогда не пробовал. Они уходят на пустую поляну.", "Спеть вместе", "Научить дышать глубоко", "Порычать вдвоём"], ["Рык-Рык поёт тоненьким «пи-пи», и звук получается удивительно красивым. Птички подхватывают, а вокруг собираются соседи-динозавры.", "Позвать всех подпевать", "Сыграть на дудочке", "Похлопать в такт"], ["Динозавры устраивают хор, и Рык-Рык становится главным запевалой. Рычать он так и не научился, зато теперь его слышно за три холма, а {hero} получает венок из папоротника."]],en:[["The dinosaur Rik-Rik wants to roar like his dad, but all that comes out is a quiet “peep-peep.” Everyone laughs, and he hides behind a fern.", "Walk up to Rik-Rik", "Say something kind", "Call the other dinosaurs"], ["{hero} asks: “Have you tried singing?” Rik-Rik never has. They go to an empty clearing.", "Sing together", "Teach deep breathing", "Try roaring together"], ["Rik-Rik sings with his little “peep-peep,” and the sound turns out wonderfully pretty. Birds join in, and the neighbor dinosaurs gather around.", "Invite everyone to sing along", "Play a little flute", "Clap along"], ["The dinosaurs form a choir, and Rik-Rik becomes the lead singer. He never learned to roar, but now he can be heard three hills away, and {hero} receives a fern wreath."]]}},
{id:"hot_springs",world:4,prem:false,t:{ru:"Долина тёплых источников",en:"The Valley of Hot Springs"},c:{ru:[["В Долине тёплых источников вода вдруг стала холодной, и динозавры дрожат. {hero} слышит, как под землёй что-то урчит.", "Приложить ухо к земле", "Потрогать воду", "Спросить стегозавра"], ["Старый стегозавр объясняет: «Под землёй живёт вулканчик Пуф. Его кто-то обидел, и он перестал греть воду». В земле видна узкая трещина.", "Заглянуть в трещину", "Позвать Пуфа", "Принести угощение"], ["Из трещины выглядывает маленький вулканчик, весь надутый: «Динозавры бросают в меня камешки!» Оказывается, малыши играли в мяч и не знали, что он там.", "Извиниться за всех", "Объяснить малышам", "Научить играть в мяч подальше"], ["Малыши делают Пуфу подушку из мха и играют в мяч на безопасном лугу. Вода снова тёплая, а Пуф выпускает из трещины колечко пара — специально для {hero}."]],en:[["In the Valley of Hot Springs, the water suddenly turns cold, and the dinosaurs shiver. {hero} hears something rumbling under the ground.", "Press an ear to the ground", "Touch the water", "Ask the stegosaurus"], ["The old stegosaurus explains: “A little volcano named Puff lives underground. Someone upset him, and he stopped warming the water.” A narrow crack runs through the ground.", "Peek into the crack", "Call Puff", "Bring a treat"], ["A tiny volcano peeks out of the crack, all puffed up: “The dinosaurs keep throwing pebbles at me!” It turns out the little ones were playing ball and didn’t know he was there.", "Apologize for everyone", "Explain it to the little ones", "Teach a ball game far away"], ["The little ones make Puff a moss pillow and play ball on a safe meadow. The water is warm again, and Puff sends up a ring of steam, just for {hero}."]]}},
{id:"firefly_ball",world:4,prem:false,t:{ru:"Бал светлячков",en:"The Firefly Ball"},c:{ru:[["В древнем лесу наступает ночь. {hero} замечает множество светлячков, которые собираются в круг. Сегодня у них главный бал года.", "Подойти ближе", "Спрятаться за деревом", "Выключить фонарик"], ["Но танцевать некому: бал не начинается, потому что королева светлячков потеряла свою искорку. Все стоят и тихо мигают.", "Искать искорку", "Спросить у ночной бабочки", "Предложить свой фонарик"], ["Искорка нашлась в паутине, где запуталась, как капля росы. Паучок виновато шепчет: «Я думал, это звёздочка. Простите!»", "Освободить искорку", "Пригласить паучка на бал", "Объяснить, что она чужая"], ["Королева прикрепляет искорку к своей короне, а паучок получает приглашение на первый танец. Весь лес светится, а {hero} танцует со светлячками до самого утра."]],en:[["Night falls in the prehistoric forest. {hero} notices lots of fireflies gathering in a circle. Tonight is the biggest ball of the year.", "Come closer", "Hide behind a tree", "Switch off the flashlight"], ["But nobody dances: the ball can’t begin because the firefly queen lost her spark. Everyone stands still, blinking softly.", "Look for the spark", "Ask the night moth", "Offer your flashlight"], ["The spark is found in a spiderweb, where it got tangled like a drop of dew. The little spider whispers guiltily: “I thought it was a star. I’m sorry!”", "Free the spark", "Invite the spider to the ball", "Explain that it belongs to someone"], ["The queen pins the spark to her crown, and the spider is invited to the first dance. The whole forest glows, and {hero} dances with the fireflies until morning."]]}},
{id:"station_edge",world:0,prem:true,cost:8,t:{ru:"Станция на краю галактики",en:"The Station at the Edge of the Galaxy"},c:{ru:[["На краю галактики стоит маленькая станция, где работает {hero}. Сегодня все экраны мигнули и показали странное слово: «Скучаем». Кто-то пытается связаться.", "Проверить антенну", "Ответить в микрофон", "Позвать повара-робота"], ["Сигнал идёт от крошечного корабля, который застрял в пылевом облаке. Внутри сидит инопланетная малышка с большими ушами.", "Отправить тросик", "Включить маячок", "Спеть ей по рации"], ["Тросик натягивается, и корабль медленно ползёт к станции. Но малышка боится идти одна: «Тут слишком шумно и ярко!»", "Приглушить свет", "Взять её за руку", "Показать комнату с игрушками"], ["Малышка находит новых друзей: повара-робота, который печёт звёздное печенье, и {hero}. Теперь на станции всегда горит окошко «Добро пожаловать»."]],en:[["At the edge of the galaxy stands a little station where {hero} works. Today every screen flickers and shows a strange word: “Miss you.” Someone is trying to make contact.", "Check the antenna", "Answer into the microphone", "Call the robot cook"], ["The signal comes from a tiny ship stuck in a dust cloud. Inside sits an alien toddler with big ears.", "Send a tow line", "Switch on a beacon", "Sing to her over the radio"], ["The line tightens and the ship slowly creeps toward the station. But the little one is scared to come alone: “It’s too loud and bright here!”", "Dim the lights", "Hold her hand", "Show her the toy room"], ["The little one finds new friends: the robot cook who bakes star cookies, and {hero}. Now a window labeled “Welcome” always glows on the station."]]}},
{id:"singing_stones",world:0,prem:true,cost:6,t:{ru:"Планета музыкальных камней",en:"Planet of Singing Stones"},c:{ru:[["На Планете Музыкальных Камней под ногами {hero} каждый камень звенит по-своему. Но самый большой валун молчит и хмурится.", "Постучать по валуну", "Спросить у камешков", "Послушать тишину"], ["Маленькие камешки шепчут: «У него нет своей ноты. Он грустит». На земле лежит треснувшая флейта из лунного стекла.", "Взять флейту", "Позвать ветер", "Попробовать сыграть"], ["Из флейты выходит тихий, неуверенный звук. Камешки подхватывают его, и валун вздрагивает, будто просыпается.", "Сыграть громче", "Сыграть вместе с камешками", "Подождать, что будет"], ["Валун звенит низко и тепло, как большой колокол. Теперь это самая главная нота планеты, а {hero} получает на память звонкий камешек."]],en:[["On the Planet of Singing Stones, every stone under {hero}’s feet rings in its own way. But the biggest boulder stays silent and frowns.", "Tap the boulder", "Ask the pebbles", "Listen to the silence"], ["The little pebbles whisper: “He has no note of his own. He is sad.” A cracked flute of moon glass lies on the ground.", "Pick up the flute", "Call the wind", "Try to play it"], ["A quiet, shy sound comes from the flute. The pebbles pick it up, and the boulder shivers as if waking.", "Play louder", "Play along with the pebbles", "Wait and see"], ["The boulder rings low and warm like a big bell. Now it is the main note of the planet, and {hero} gets a ringing pebble to keep."]]}},
{id:"space_zoo",world:0,prem:true,cost:10,t:{ru:"Космический зоопарк",en:"The Space Zoo"},c:{ru:[["{hero} впервые приходит в Космический зоопарк. Но клетки пусты, а над головой что-то шуршит и хихикает.", "Посмотреть вверх", "Позвать смотрителя", "Заглянуть в клетку"], ["Над головой в невесомости парят звёздные зверята: светящийся жук, кролик с антеннами и осьминожек-астронавт. Они сбежали поиграть!", "Поймать сачком", "Позвать игрой", "Присоединиться к игре"], ["Звёздные зверята согласны вернуться, если им покажут, где мягко спать. Но в клетках слишком жёстко.", "Сшить подушки из облаков", "Включить колыбельную", "Устроить общий ночлег"], ["Зверята засыпают, свернувшись клубочком под куполом, а смотритель благодарит {hero}. С тех пор в зоопарке нет заборов, только мягкие облака."]],en:[["{hero} visits the Space Zoo for the first time. But the cages are empty, and something rustles and giggles overhead.", "Look up", "Call the keeper", "Peek into a cage"], ["Overhead, star-critters float in zero gravity: a glowing beetle, a rabbit with antennas, and a tiny astronaut octopus. They ran away to play!", "Catch them with a net", "Call them with a game", "Join the game"], ["The star-critters agree to return if someone shows them a soft place to sleep. But the cages are too hard.", "Sew cushions from clouds", "Play a lullaby", "Make one big sleepover"], ["The critters fall asleep curled up under the dome, and the keeper thanks {hero}. Since then the zoo has no fences, only soft clouds."]]}},
{id:"cloud_castle",world:1,prem:true,cost:8,t:{ru:"Замок из облаков",en:"The Castle in the Clouds"},c:{ru:[["Над облаками {hero} замечает замок из белой ваты. Подъёмный мост опущен, а на башне кто-то машет флажком.", "Подняться по радужной лестнице", "Позвать на помощь птиц", "Помахать в ответ"], ["На башне стоит принцесса-облачко. Она вздыхает: «Дождь не идёт, потому что я забыла, как плакать. Не могу его позвать».", "Рассказать смешную историю", "Рассказать грустную историю", "Включить музыку"], ["Принцесса слушает, и в её глазах блестит первая капелька. Вся вата замка начинает тихо звенеть.", "Подставить ладони", "Обнять принцессу", "Раскрыть зонтик"], ["Идёт тёплый ласковый дождь, и далеко внизу расцветают поля. Принцесса дарит {hero} каплю-кулон, в которой отражается радуга."]],en:[["Above the clouds, {hero} spots a castle made of white cotton. The drawbridge is down, and someone on the tower waves a little flag.", "Climb the rainbow stairs", "Ask the birds for help", "Wave back"], ["On the tower stands a cloud princess. She sighs: “The rain won’t come because I forgot how to cry. I can’t call it.”", "Tell a funny story", "Tell a sad story", "Play some music"], ["The princess listens, and a first drop glitters in her eye. All the castle’s cotton begins to chime softly.", "Hold out your palms", "Hug the princess", "Open an umbrella"], ["A warm, gentle rain falls, and far below the fields bloom. The princess gives {hero} a raindrop pendant that reflects a rainbow."]]}},
{id:"forest_orchestra",world:1,prem:true,cost:6,t:{ru:"Лесной оркестр",en:"The Forest Orchestra"},c:{ru:[["Вечером в лесу проходит репетиция оркестра зверей. Но дирижёр-сова охрипла, и музыка превращается в шум.", "Послушать, что не так", "Предложить свою палочку", "Позвать зайца-барабанщика"], ["Каждый играет в своём темпе: лягушки спешат, а медведь-контрабас отстаёт. Сова беспомощно машет крыльями.", "Хлопать ритм", "Попросить всех слушать друг друга", "Расставить зверей по кругу"], ["Звери садятся в круг, и {hero} задаёт ритм. Сначала получается неловко, но потом лягушки подстраиваются под медведя.", "Кивнуть сове", "Добавить колокольчик", "Пропеть вступление"], ["Оркестр звучит дружно, а сова радостно ухает. {hero} получает почётное место дирижёра на следующем концерте под звёздами."]],en:[["In the evening the forest animals rehearse as an orchestra. But the owl conductor has lost her voice, and the music turns into noise.", "Listen for what’s wrong", "Offer your own baton", "Call the rabbit drummer"], ["Everyone plays at their own speed: the frogs rush, and the bear on double bass drags behind. The owl flaps her wings helplessly.", "Clap the rhythm", "Ask everyone to listen to each other", "Arrange the animals in a circle"], ["The animals sit in a circle, and {hero} sets the beat. It is awkward at first, but then the frogs match the bear.", "Nod to the owl", "Add a little bell", "Hum the intro"], ["The orchestra sounds in harmony, and the owl hoots happily. {hero} gets the honored place of conductor at the next concert under the stars."]]}},
{id:"giant_gift",world:1,prem:true,cost:10,t:{ru:"Подарок для великана",en:"A Gift for the Giant"},c:{ru:[["Великан Громыч живёт на горе и ни с кем не дружит: все его боятся. {hero} решает подарить ему подарок.", "Собрать цветы", "Испечь пирог", "Нарисовать открытку"], ["Подарок слишком маленький для огромных рук. Громыч сначала хмурится, но потом осторожно берёт его двумя пальцами.", "Подождать, что он скажет", "Объяснить, что это от души", "Улыбнуться"], ["Громыч смущённо краснеет: «Мне ещё никто ничего не дарил». Он достаёт из кармана огромный, но очень красивый мячик.", "Принять мячик", "Пригласить играть", "Позвать других друзей"], ["Скоро вся деревня играет в мяч с Громычем на лугу. Он больше не страшный, а {hero} стал его первым и лучшим другом."]],en:[["The giant Grumble lives on a mountain and never has friends, because everyone is afraid of him. {hero} decides to bring him a gift.", "Pick flowers", "Bake a pie", "Draw a card"], ["The gift is too small for his enormous hands. Grumble frowns at first, then carefully takes it between two fingers.", "Wait to hear what he says", "Explain it comes from the heart", "Smile"], ["Grumble blushes shyly: “Nobody has ever given me anything.” From his pocket he pulls a huge but beautiful ball.", "Accept the ball", "Invite him to play", "Call other friends"], ["Soon the whole village plays ball with Grumble in the meadow. He is not scary anymore, and {hero} became his first and best friend."]]}},
{id:"empty_aquarium",world:2,prem:true,cost:8,t:{ru:"Тайна пустого аквариума",en:"The Empty Aquarium"},c:{ru:[["Утром в школьном аквариуме не оказалось ни одной рыбки. Вода тихая, а на стекле остались мокрые следы маленьких ножек.", "Рассмотреть следы", "Спросить уборщицу", "Посмотреть под столом"], ["Следы ведут к окну. На подоконнике стоит банка с мелкими камушками и записка: «Мы вернёмся». Рядом звякает колокольчик.", "Заглянуть в банку", "Прислушаться к колокольчику", "Открыть окно"], ["Из колокольчика слышен тонкий голосок: «Нам стало скучно, мы пошли смотреть настоящее море». Рыбки сидят в игрушечном кораблике.", "Попросить вернуться", "Пообещать экскурсию", "Предложить нарисовать море"], ["{hero} с классом рисует на стене огромное море и ставит рядом аквариум. Рыбки возвращаются и каждое утро машут хвостиками у «настоящей» воды."]],en:[["In the morning the school aquarium has not a single fish. The water is calm, and there are tiny wet footprints on the glass.", "Study the prints", "Ask the cleaner", "Look under the table"], ["The prints lead to the window. On the sill stands a jar of pebbles and a note: “We will be back.” A bell jingles nearby.", "Look in the jar", "Listen to the bell", "Open the window"], ["A thin little voice comes from the bell: “We got bored and went to see the real sea.” The fish sit in a toy boat.", "Ask them to return", "Promise a field trip", "Suggest drawing the sea"], ["{hero} and the class paint a huge sea on the wall and put the aquarium beside it. The fish return and wave their tails every morning at the “real” water."]]}},
{id:"mailbox_secret",world:2,prem:true,cost:6,t:{ru:"Почтовый ящик с секретом",en:"The Mailbox with a Secret"},c:{ru:[["У дома {hero} стоит старый почтовый ящик. Сегодня внутри лежит конверт без марки, а на нём нарисована ласточка.", "Открыть конверт", "Понюхать конверт", "Показать маме"], ["В конверте записка: «Найди меня там, где ветер учит птиц летать». Рядом лежит синее пёрышко.", "Идти на холм", "Спросить у соседа", "Взять бинокль"], ["На холме сидит птенец ласточки, который боится взлететь. Это он написал письмо, потому что его никто не слышал.", "Поддержать птенца", "Показать, как махать руками", "Подождать вместе"], ["Птенец делает первый взмах и летит над лугом. Ласточка оставляет в ящике новое письмо: «Спасибо, друг». Теперь {hero} каждый день находит там по перышку."]],en:[["By {hero}’s house stands an old mailbox. Today there is an envelope inside with no stamp, and a swallow is drawn on it.", "Open the envelope", "Sniff the envelope", "Show Mom"], ["In the envelope is a note: “Find me where the wind teaches birds to fly.” A blue feather lies beside it.", "Go to the hill", "Ask the neighbor", "Take binoculars"], ["On the hill sits a baby swallow who is afraid to fly. He wrote the letter, because no one could hear him.", "Encourage the chick", "Show how to flap your arms", "Wait together"], ["The chick takes his first flap and glides over the meadow. A swallow leaves a new letter in the box: “Thank you, friend.” Now {hero} finds a feather there every day."]]}},
{id:"fog_lantern",world:2,prem:true,cost:10,t:{ru:"Фонарь в тумане",en:"The Lantern in the Fog"},c:{ru:[["Над городом стоит густой туман. {hero} находит на крыльце старый фонарь, который светит голубым, но никто не знает почему.", "Зажечь фонарь", "Спросить у соседей", "Рассмотреть стекло"], ["В свете фонаря в тумане появляются светящиеся стрелочки. Они ведут по тихим улицам и звенят, как далёкие колокольчики.", "Идти за стрелочками", "Взять друга", "Оставить метки мелом"], ["Стрелочки приводят к площади, где потерялся щенок с колокольчиком на шее. Он дрожит и боится сдвинуться с места.", "Подозвать щенка", "Подойти тихо", "Дать ему печенье"], ["Щенок бежит к хозяйке, которая искала его всю ночь. Туман рассеивается, и фонарь гаснет, оставив {hero} на память маленькую голубую искру."]],en:[["A thick fog covers the town. {hero} finds an old lantern on the porch that glows blue, and nobody knows why.", "Light the lantern", "Ask the neighbors", "Examine the glass"], ["In the lantern’s light, glowing little arrows appear in the fog. They lead along quiet streets and chime like distant bells.", "Follow the arrows", "Take a friend", "Leave chalk marks"], ["The arrows lead to a square where a puppy with a little bell on his neck is lost. He trembles and is afraid to move.", "Call the puppy", "Approach quietly", "Offer a cookie"], ["The puppy runs to his owner, who searched all night. The fog clears, and the lantern goes dark, leaving {hero} a tiny blue spark to remember it."]]}},
{id:"bubble_city",world:3,prem:true,cost:8,t:{ru:"Город пузырьков",en:"Bubble City"},c:{ru:[["Под водой {hero} находит город из пузырьков: дома переливаются, а улицы чуть подпрыгивают. Но жители растерянно носятся туда-сюда.", "Подойти к жителям", "Заглянуть в окно", "Потрогать пузырёк"], ["Мэр, рыба-фугу, объясняет: «Наш главный Пузырь-Фонарь лопнул. Без него темно, и мы теряем дорогу домой».", "Предложить свой фонарик", "Собрать пузырьки", "Позвать светящихся рыбок"], ["Светящиеся рыбки плывут по кругу, а {hero} собирает мелкие пузырьки в один большой. Он дрожит, но держится.", "Добавить ещё пузырёк", "Подуть тихонько", "Поплавать вместе по кругу"], ["Новый Пузырь-Фонарь вспыхивает тёплым светом. Жители поют, а мэр вручает {hero} ключ от города в виде ракушки."]],en:[["Underwater, {hero} finds a city made of bubbles: the houses shimmer and the streets bounce a little. But the citizens rush around in confusion.", "Talk to the citizens", "Peek into a window", "Touch a bubble"], ["The mayor, a pufferfish, explains: “Our great Lantern Bubble has popped. Without it it’s dark, and we lose our way home.”", "Offer your flashlight", "Collect bubbles", "Call the glowing fish"], ["The glowing fish swim in a circle while {hero} gathers small bubbles into one big one. It wobbles but holds.", "Add one more bubble", "Blow softly", "Swim around together"], ["The new Lantern Bubble lights up with a warm glow. The citizens sing, and the mayor gives {hero} a shell-shaped key to the city."]]}},
{id:"sea_light",world:3,prem:true,cost:6,t:{ru:"Морской огонёк",en:"The Little Sea Light"},c:{ru:[["В тёмных глубинах {hero} встречает крошечную медузу, которая не умеет светиться. Остальные медузы мерцают, а она лишь печально плавает по кругу.", "Подплыть и поздороваться", "Показать на светящуюся рыбку", "Спросить, что она умеет"], ["Медуза Лу признаётся: «Я умею только слушать». Она слышит даже то, что другие не замечают: как шепчут водоросли и дышит дно.", "Попросить рассказать", "Послушать вместе", "Записать услышанное"], ["Лу слышит тихий плач: маленький краб заблудился в темноте. Только она знает, откуда идёт звук.", "Плыть на звук", "Взять Лу за щупальце", "Позвать других медуз"], ["Лу приводит краба домой, и вдруг её тело мягко светится: радость зажгла огонёк. Теперь Лу самая любимая медуза в глубинах, а {hero} её лучший друг."]],en:[["In the dark depths, {hero} meets a tiny jellyfish who cannot glow. The other jellyfish shimmer while she only drifts sadly in circles.", "Swim over and say hello", "Point to a glowing fish", "Ask what she is good at"], ["The jellyfish Lu admits: “All I can do is listen.” She hears what others miss: how seaweed whispers and the seabed breathes.", "Ask her to tell", "Listen together", "Write down what you hear"], ["Lu hears quiet crying: a little crab is lost in the dark. Only she knows where the sound comes from.", "Swim toward the sound", "Hold Lu’s tentacle", "Call the other jellyfish"], ["Lu leads the crab home, and suddenly her body glows softly: joy lit a little light. Now Lu is the most beloved jellyfish in the deep, and {hero} is her best friend."]]}},
{id:"lost_shells",world:3,prem:true,cost:10,t:{ru:"Остров потерянных ракушек",en:"Island of Lost Shells"},c:{ru:[["На острове Потерянных Ракушек {hero} находит пляж, усыпанный ракушками. В каждой тихо шумит что-то своё: песня, смех, чьё-то имя.", "Приложить ракушку к уху", "Собрать все", "Позвать чайку"], ["Чайка Клёпа объясняет: «Это ракушки-воспоминания. Каждая ждёт, пока её вернут хозяину». Одна ракушка светится ярче остальных.", "Взять светящуюся ракушку", "Спросить, чья она", "Положить на место"], ["Из ракушки слышится смех маленькой девочки и плеск волн. Чайка вспоминает: её хозяйка живёт в рыбацкой деревне на другом берегу.", "Лететь к деревне", "Плыть на лодке", "Передать ракушку чайке"], ["Девочка прижимает ракушку к уху и улыбается: «Я искала её много лет». Чайка Клёпа машет крылом {hero}: ещё много ракушек ждут своих хозяев."]],en:[["On the Island of Lost Shells, {hero} finds a beach strewn with shells. Each one murmurs something different: a song, a laugh, someone’s name.", "Hold a shell to your ear", "Collect them all", "Call a seagull"], ["The seagull Clepa explains: “These are memory shells. Each waits to be returned to its owner.” One shell glows brighter than the rest.", "Pick up the glowing shell", "Ask whose it is", "Put it back"], ["From the shell comes a little girl’s laughter and the splash of waves. The seagull remembers: its owner lives in a fishing village on the far shore.", "Fly to the village", "Go by boat", "Hand the shell to the gull"], ["The girl presses the shell to her ear and smiles: “I looked for it for years.” Clepa waves a wing at {hero}: many more shells are waiting for their owners."]]}},
{id:"dino_school",world:4,prem:true,cost:8,t:{ru:"Школа маленьких динозавров",en:"Little Dino School"},c:{ru:[["Сегодня первый день в Школе маленьких динозавров. {hero} помогает учительнице-диплодоку, но один малыш прячется под листом и не хочет выходить.", "Присесть рядом", "Предложить ягодную конфетку", "Позвать учительницу"], ["Малыш Тото шепчет: «Я боюсь, что у меня не получится». На доске нарисованы простые задания: считать камешки и прыгать через бревно.", "Начать с камешков", "Начать с прыжков", "Помочь вместе"], ["Тото считает камешки до трёх, потом до пяти. Дети хлопают, и Тото сам просит прыгать через бревно.", "Подбодрить", "Прыгнуть первым", "Держать его за лапу"], ["Тото перепрыгивает бревно и громко топает от радости. Учительница вручает ему звёздочку, а {hero} получает значок «Лучший помощник класса»."]],en:[["Today is the first day at Little Dino School. {hero} helps the diplodocus teacher, but one little dino hides under a leaf and won’t come out.", "Sit down beside him", "Offer a berry candy", "Call the teacher"], ["Little Toto whispers: “I’m afraid I won’t be able to do it.” Simple tasks are drawn on the board: count pebbles and jump over a log.", "Start with pebbles", "Start with jumping", "Help together"], ["Toto counts pebbles to three, then to five. The kids clap, and Toto himself asks to jump over the log.", "Cheer him on", "Jump first", "Hold his paw"], ["Toto hops over the log and stomps with joy. The teacher gives him a star, and {hero} gets a badge reading “Best Class Helper.”"]]}},
{id:"sneezing_mountain",world:4,prem:true,cost:6,t:{ru:"Гора, которая чихала",en:"The Mountain That Sneezed"},c:{ru:[["Гора Чихалка в долине динозавров вдруг чихнула, и вся долина покрылась пылью и пеплом. {hero} слышит, как гора жалобно сопит.", "Подойти к горе", "Позвать динозавров", "Принести воды"], ["Гора шепчет: «В носу щекочет». Из пещеры торчит огромное перо, которое щекочет каменный нос.", "Вытащить перо", "Попросить помощи у птеродактиля", "Подуть изо всех сил"], ["Птеродактиль аккуратно вытаскивает перо. Гора морщится, шмыгает и... замирает, глубоко вдыхая.", "Отойти подальше", "Зажать уши", "Раскрыть зонтик"], ["Гора громко чихает, но уже почти без пыли, и по долине разлетается радужный туман. Динозавры радуются, а {hero} становится почётным лекарем Горы."]],en:[["The Sneezing Mountain in the dino valley suddenly sneezes, and the whole valley is covered in dust and ash. {hero} hears the mountain sniffling miserably.", "Walk up to the mountain", "Call the dinosaurs", "Bring water"], ["The mountain whispers: “My nose tickles.” A huge feather sticks out of a cave and tickles the stone nose.", "Pull out the feather", "Ask the pterodactyl for help", "Blow with all your might"], ["The pterodactyl carefully pulls out the feather. The mountain wrinkles up, sniffs, and then freezes, taking a deep breath.", "Step far back", "Cover your ears", "Hold up an umbrella"], ["The mountain sneezes loudly, but with almost no dust, and a rainbow mist drifts across the valley. The dinosaurs cheer, and {hero} becomes the Mountain’s honored doctor."]]}},
{id:"jungle_guard",world:4,prem:true,cost:10,t:{ru:"Ночной сторож джунглей",en:"The Jungle Night Guard"},c:{ru:[["Ночью в джунглях кто-то шуршит. {hero} вместе с маленьким динозавром Мини дежурит у костра и слушает странные звуки.", "Включить фонарик", "Тихо подкрасться", "Позвать старшего"], ["Из кустов выглядывают два светящихся глаза. Мини дрожит, но {hero} замечает, что глаза слишком маленькие для чудовища.", "Протянуть ладонь", "Бросить ягоду", "Сказать «привет»"], ["Это малыш-лемур, который заблудился и потерял маму. Он тихо пищит и прижимается к ногам Мини.", "Накормить ягодой", "Поискать маму", "Спеть колыбельную"], ["Мама-лемур находит малыша по песне и благодарно уносит его на дерево. Мини больше не боится ночи, а {hero} получает значок «Ночной сторож джунглей»."]],en:[["Something rustles in the jungle at night. {hero} and a little dinosaur named Mini keep watch by the campfire and listen to the strange sounds.", "Switch on a flashlight", "Sneak up quietly", "Call an elder"], ["Two glowing eyes peek out of the bushes. Mini trembles, but {hero} notices the eyes are too small for a monster.", "Hold out a palm", "Toss a berry", "Say “hello”"], ["It is a baby lemur who got lost and lost his mother. He squeaks softly and snuggles against Mini’s legs.", "Feed him a berry", "Look for his mom", "Sing a lullaby"], ["The mother lemur finds her baby by the song and carries him gratefully up a tree. Mini is no longer afraid of the night, and {hero} receives a badge: “Jungle Night Guard.”"]]}},
];
function buyStory(x){if(!spend(x.cost)){say("libNotice",NEED[lang].replace("{n}",x.cost-stars()));return}addOwn("st:"+x.id);say("libNotice",BOUGHT[lang]);drawLib()}
function drawLib(){const b=$("library");if(!b)return;b.innerHTML="";let n=0;[[false,UI.free],[true,UI.best]].forEach(([p,lab])=>{const L=LIB.filter(x=>x.prem===p&&x.c[lang]);if(p)L.sort((u,v)=>(u.cost||0)-(v.cost||0));if(!L.length)return;const h=document.createElement("p");h.className="muted small";h.textContent=lab[lang];b.appendChild(h);L.forEach(x=>{const k=document.createElement("button");k.className="choice";k.type="button";const ok=!x.prem||!x.cost||has("st:"+x.id);k.textContent=(ok?(x.prem?"💎 ":"▶ "):"🔒 ")+x.t[lang]+" · 📖"+x.c[lang].length+(ok?"":" · ⭐"+x.cost);k.onclick=()=>{if(ok){say("libNotice","");startLib(x.id)}else buyStory(x)};b.appendChild(k);n++})});if(!n){const p=document.createElement("p");p.className="muted small";p.textContent=UI.nolib[lang];b.appendChild(p)}say("libTitle",UI.lib[lang])}
function startLib(id){const st=LIB.find(x=>x.id===id),raw=st&&st.c[lang],hero=$("hero").value.trim();if(!raw)return;if(!hero){say("setupNotice",tr().need);$("hero").focus();return}say("setupNotice","");reset();const chs=raw.map(c=>[c[0].replaceAll("{hero}",()=>hero),...c.slice(1)]);game={id:String(Date.now()),hero,world:st.world,step:0,log:[],av,ai:true,lib:st.id,slang:lang,aiTitle:st.t[lang],chs,total:chs.length,done:false,cur:{text:chs[0][0],choices:chs[0].slice(1)}};$("setup").classList.add("hidden");$("game").classList.remove("hidden");drawAI();$("game").scrollIntoView({behavior:"smooth"})}
function chooseLib(c){if(!game||game.done)return;game.log.push({text:game.cur.text,choice:c});game.step++;const n=game.chs[game.step];game.cur={text:n[0],choices:n.slice(1)};if(game.step>=game.total-1){game.done=true;game.cur.choices=[];game.log.push({text:n[0],choice:""})}drawAI()}

const HLP={"ru": {"t": "Как пользоваться", "s": ["Введи имя героя, выбери мир и нажми «Создать мою историю». Кнопка 🎲 выберет мир за тебя.", "Читай и выбирай, что делать дальше. Каждый выбор двигает историю вперёд, обычно на 4 главы.", "Нажми «Слушать», и история прозвучит вслух. Над кнопкой можно выбрать стиль и голос.", "«Сохранить» кладёт историю в список «Мои сохранённые истории» внизу. Её можно продолжить позже или скачать.", "📚 — библиотека готовых историй. 🎵 — музыка, 🌙 — ночной режим, A− и A+ — размер текста.", "Язык и тему оформления можно сменить вверху. Кнопка «Новая история» выходит из текущей.", "ИИ пишет истории, когда он доступен, но их число в день ограничено. Если ИИ недоступен, запускается готовая история, она работает и без интернета."], "c": "Понятно"}, "en": {"t": "How to use", "s": ["Type a hero name, choose a world and tap “Create my story.” The 🎲 button picks a world for you.", "Read and choose what happens next. Each choice moves the story forward, usually for 4 chapters.", "Tap “Listen” to hear the story read aloud. You can pick a style and voice above the button.", "“Save” puts the story in “My saved stories” below. You can continue it later or download it.", "📚 is the library of ready-made stories. 🎵 is music, 🌙 is night mode, A− and A+ change text size.", "Change the language and theme at the top. The “New story” button leaves the current story.", "The AI writes stories when it is available, but the number per day is limited. If it is unavailable, a ready-made story starts and works offline."], "c": "Got it"}, "de": {"t": "So funktioniert es", "s": ["Gib einen Heldennamen ein, wähle eine Welt und tippe auf „Meine Geschichte erstellen“. Der 🎲-Knopf wählt eine Welt für dich.", "Lies und wähle, was als Nächstes passiert. Jede Wahl bringt die Geschichte voran, meist über 4 Kapitel.", "Tippe auf „Vorlesen“, um die Geschichte zu hören. Über dem Knopf wählst du Stil und Stimme.", "„Speichern“ legt die Geschichte unten in „Meine gespeicherten Geschichten“ ab. Du kannst sie später fortsetzen oder herunterladen.", "📚 ist die Bibliothek fertiger Geschichten. 🎵 ist Musik, 🌙 der Nachtmodus, A− und A+ ändern die Textgröße.", "Sprache und Design änderst du oben. Mit „Neue Geschichte“ verlässt du die aktuelle.", "Die KI schreibt Geschichten, wenn sie verfügbar ist, aber pro Tag nur begrenzt. Ist sie nicht verfügbar, startet eine fertige Geschichte, die auch offline funktioniert."], "c": "Verstanden"}, "es": {"t": "Cómo usar la app", "s": ["Escribe el nombre del héroe, elige un mundo y pulsa «Crear mi historia». El botón 🎲 elige un mundo por ti.", "Lee y elige qué pasa después. Cada elección hace avanzar la historia, normalmente durante 4 capítulos.", "Pulsa «Escuchar» para oír la historia en voz alta. Sobre el botón puedes elegir estilo y voz.", "«Guardar» pone la historia en «Mis historias guardadas», abajo. Puedes continuarla más tarde o descargarla.", "📚 es la biblioteca de historias preparadas. 🎵 es música, 🌙 modo nocturno, A− y A+ cambian el tamaño del texto.", "Cambia el idioma y el tema arriba. El botón «Nueva historia» sale de la historia actual.", "La IA escribe historias cuando está disponible, pero hay un límite diario. Si no está disponible, empieza una historia preparada que funciona sin internet."], "c": "Entendido"}, "fr": {"t": "Comment utiliser l’appli", "s": ["Saisis le nom du héros, choisis un monde et appuie sur « Créer mon histoire ». Le bouton 🎲 choisit un monde pour toi.", "Lis et choisis ce qui se passe ensuite. Chaque choix fait avancer l’histoire, en général sur 4 chapitres.", "Appuie sur « Écouter » pour entendre l’histoire à voix haute. Au-dessus du bouton, tu peux choisir un style et une voix.", "« Enregistrer » place l’histoire dans « Mes histoires enregistrées », en bas. Tu pourras la continuer plus tard ou la télécharger.", "📚 est la bibliothèque d’histoires prêtes. 🎵 est la musique, 🌙 le mode nuit, A− et A+ changent la taille du texte.", "Change la langue et le thème en haut. Le bouton « Nouvelle histoire » quitte l’histoire en cours.", "L’IA écrit des histoires quand elle est disponible, mais leur nombre par jour est limité. Sinon, une histoire prête démarre et fonctionne même hors ligne."], "c": "Compris"}, "zh": {"t": "使用说明", "s": ["输入主角名字，选择一个世界，然后点“创建我的故事”。🎲 按钮会替你选世界。", "阅读并选择接下来发生什么。每个选择都会推进故事，通常有 4 章。", "点“朗读”就能听故事。按钮上方可以选择风格和声音。", "“保存”会把故事放进下方的“我的故事”。以后可以继续，也可以下载。", "📚 是现成故事库。🎵 是音乐，🌙 是夜间模式，A− 和 A+ 调整文字大小。", "语言和主题可在顶部更改。“新故事”按钮会退出当前故事。", "AI 可用时会写故事，但每天数量有限。AI 不可用时会开始现成的故事，没有网络也能玩。"], "c": "知道了"}, "hi": {"t": "इस्तेमाल कैसे करें", "s": ["नायक का नाम लिखें, एक दुनिया चुनें और “मेरी कहानी बनाओ” दबाएँ। 🎲 बटन आपके लिए दुनिया चुन देता है।", "पढ़ें और चुनें कि आगे क्या हो। हर चुनाव कहानी को आगे बढ़ाता है, आमतौर पर 4 अध्याय।", "“सुनें” दबाने पर कहानी बोलकर सुनाई जाती है। बटन के ऊपर शैली और आवाज़ चुन सकते हैं।", "“सेव” कहानी को नीचे “मेरी कहानियाँ” में रखता है। उसे बाद में जारी रख सकते हैं या डाउनलोड कर सकते हैं।", "📚 तैयार कहानियों का पुस्तकालय है। 🎵 संगीत, 🌙 रात मोड, A− और A+ अक्षरों का आकार बदलते हैं।", "भाषा और थीम ऊपर से बदलें। “नई कहानी” बटन मौजूदा कहानी से बाहर निकालता है।", "AI उपलब्ध होने पर कहानियाँ लिखता है, पर रोज़ की संख्या सीमित है। उपलब्ध न हो तो तैयार कहानी शुरू होती है, जो बिना इंटरनेट भी चलती है।"], "c": "समझ गया"}};

[["Im Königreich der Regenbogenhügel haben die Wolken das Schweben verlernt und hängen still über dem Boden. Die kleine Fee Lila bittet {hero} um Hilfe: „Nur der Wolkengärtner weiß, wie man sie weckt.“","Der Fee folgen","Nach dem Gärtner fragen","Eine Wolke berühren"],["Der Gärtner ist eine alte Eule mit einer Gießkanne. Er sagt: „Wolken lieben Lachen und warme Lieder. Überlege, wie du sie aufheiterst.“","Einen Witz erzählen","Ein Lied singen","Auf dem Hügel tanzen"],["Die Wolken kichern, werden flauschig und ziehen über den Himmel. Ein warmer Regenbogenregen fällt, und die Hügel beginnen zu blühen. Lila klatscht: „Du hast den Himmel wieder in Bewegung gebracht!“","Einen Regenbogen fangen","Der Eule danken","Eine Blume pflanzen"]],
[["Auf dem Schulfest ist der größte Kuchen verschwunden! {hero} entdeckt eine Krümelspur und eine kleine glänzende Schleife auf dem Boden.","Der Krümelspur folgen","Die Schleife untersuchen","Den Koch fragen"],["Die Spur führt zu einem alten Schrank. Von drinnen hört man leises Schnurren und das Rascheln von Folie.","Den Schrank einen Spalt öffnen","An der Tür warten","Leise anklopfen"],["Drinnen sitzt eine Katze mit Schleife und ihre Kätzchen. Sie hatten ein Stück Kuchen genommen, weil sie hungrig waren. {hero} lächelt: Das Rätsel ist gelöst, und der Kuchen reicht für alle!","Den Kuchen mit allen teilen","Die Kätzchen streicheln","Dem Koch Bescheid sagen"]]]},
es:{titles:["El faro de la Luna","El jardinero de nubes","El pastel desaparecido"],scenes:[
[["En la Luna, {hero} encuentra un faro antiguo. Un pequeño robot llamado Bip parpadea con tristeza: «Mi luz se apagó y los barcos no encuentran el camino a casa».","Arreglar el faro con Bip","Preguntar qué pasó","Explorar la cueva lunar"],["Bajo el faro hay una cueva llena de cristales que brillan suavemente. Uno tararea una melodía y otro tiembla como si fuera tímido.","Tomar el cristal que canta","Calmar el cristal que tiembla","Llamar a Bip para pedir ayuda"],["El cristal encaja y un rayo de luz salpica las estrellas. A lo lejos parpadean lucecitas: los barcos vuelven a casa. Bip grita feliz: «¡Eres un verdadero amigo de las estrellas!»","Saludar a los barcos","Abrazar a Bip","Hacer la luz aún más brillante"]],
[["En el Reino de las Colinas Arcoíris, las nubes olvidaron cómo flotar y cuelgan quietas sobre el suelo. El hada Lila le pide ayuda a {hero}: «Solo el Jardinero de Nubes sabe cómo despertarlas».","Seguir al hada","Preguntar por el jardinero","Tocar una nube"],["El jardinero es un viejo búho con una regadera. Dice: «A las nubes les encantan las risas y las canciones cálidas. Piensa cómo alegrarlas».","Contar un chiste","Cantar una canción","Bailar en la colina"],["Las nubes se ríen, se esponjan y se alejan por el cielo. Cae una lluvia cálida de arcoíris y las colinas se llenan de flores. Lila aplaude: «¡Has devuelto el movimiento al cielo!»","Atrapar un arcoíris","Dar las gracias al búho","Plantar una flor"]],
[["¡En la feria de la escuela ha desaparecido el pastel más grande! {hero} ve un rastro de migas y un pequeño lazo brillante en el suelo.","Seguir las migas","Examinar el lazo","Preguntar al cocinero"],["El rastro lleva a un armario viejo. Desde dentro se oyen un suave ronroneo y el crujir de papel de aluminio.","Abrir un poco el armario","Esperar junto a la puerta","Llamar con suavidad"],["Dentro hay una gata con un lazo y sus gatitos. Tomaron un trozo de pastel porque tenían hambre. {hero} sonríe: ¡misterio resuelto y hay pastel para todos!","Compartir el pastel con todos","Acariciar a los gatitos","Contárselo al cocinero"]]]},
fr:{titles:["Le phare de la Lune","Le jardinier des nuages","Le gâteau disparu"],scenes:[
[["Sur la Lune, {hero} trouve un vieux phare. Un petit robot nommé Bip clignote tristement : « Ma lumière s’est éteinte et les vaisseaux ne trouvent plus le chemin de la maison. »","Réparer le phare avec Bip","Demander ce qui s’est passé","Explorer la grotte lunaire"],["Sous le phare se cache une grotte pleine de cristaux qui brillent doucement. L’un fredonne un air, un autre tremble comme s’il était timide.","Prendre le cristal qui chante","Rassurer le cristal qui tremble","Appeler Bip à l’aide"],["Le cristal s’emboîte et un rayon de lumière éclabousse les étoiles. Au loin, de petites lumières clignotent : les vaisseaux rentrent chez eux. Bip s’écrie : « Tu es un vrai ami des étoiles ! »","Saluer les vaisseaux","Faire un câlin à Bip","Rendre la lumière encore plus vive"]],
[["Au royaume des Collines Arc-en-ciel, les nuages ont oublié comment flotter et restent immobiles au-dessus du sol. La petite fée Lila demande de l’aide à {hero} : « Seul le Jardinier des nuages sait les réveiller. »","Suivre la fée","Demander où est le jardinier","Toucher un nuage"],["Le jardinier est un vieux hibou avec un arrosoir. Il dit : « Les nuages aiment les rires et les chansons douces. Trouve comment les réjouir. »","Raconter une blague","Chanter une chanson","Danser sur la colline"],["Les nuages gloussent, se gonflent et glissent dans le ciel. Une chaude pluie d’arc-en-ciel tombe et les collines se couvrent de fleurs. Lila applaudit : « Tu as remis le ciel en mouvement ! »","Attraper un arc-en-ciel","Remercier le hibou","Planter une fleur"]],
[["À la kermesse de l’école, le plus grand gâteau a disparu ! {hero} remarque une traînée de miettes et un petit ruban brillant par terre.","Suivre les miettes","Examiner le ruban","Interroger le cuisinier"],["La traînée mène à un vieux placard. De l’intérieur, on entend un doux ronronnement et un bruissement de papier d’aluminium.","Entrouvrir le placard","Attendre devant la porte","Frapper doucement"],["À l’intérieur se trouvent une chatte avec un ruban et ses chatons. Ils ont pris un morceau de gâteau parce qu’ils avaient faim. {hero} sourit : le mystère est résolu, et il y a du gâteau pour tout le monde !","Partager le gâteau avec tous","Caresser les chatons","Le raconter au cuisinier"]]]}
};
function pk(){return game&&game.v&&ALT[lang]?ALT[lang]:tr()}
function ttl(it){return it.ai&&it.aiTitle?it.aiTitle:(it.v&&ALT[lang]?ALT[lang]:tr()).titles[it.world]}
let busy=false,seq=0,tick=null;
function stopTick(){if(tick){clearInterval(tick);tick=null}}
function startTick(lines,id){stopTick();let i=0;say(id,lines[0]);tick=setInterval(()=>{i=(i+1)%lines.length;say(id,lines[i])},2600)}
function reset(){seq++;busy=false;stopTick();stopSpeak();say("recap","");$("share").classList.add("hidden");$("libscreen").classList.add("hidden");$("savesPanel").classList.remove("hidden");stopMusic();if(musicOn)ac()}
async function ask(body){const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),30000);try{const r=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(body),signal:ctl.signal});if(!r.ok)throw new Error("http "+r.status);const d=await r.json();if(!d||typeof d.text!=="string"||!d.text||typeof d.title!=="string"||!Array.isArray(d.choices))throw new Error("bad");d.choices=d.choices.filter(c=>typeof c==="string"&&c).slice(0,3);if(!d.end&&d.choices.length<2)throw new Error("bad");return d}finally{clearTimeout(t)}}
async function begin(hero,world,id){reset();const my=seq;game={id,hero,world,step:0,log:[],av};$("setup").classList.add("hidden");$("game").classList.remove("hidden");game.v=world<3&&Math.random()<0.5?1:0;if(!AI_ON||aiLeft()<=0){drawGame();if(AI_ON)say("notice",UI.limit[lang]);return}busy=true;say("chapter",tr().chapter+" 1");say("title","✨");startTick((WAIT[lang]||[])[world]||NEXT[lang],"story");$("choices").innerHTML="";say("notice","");try{const d=await ask({lang,hero,world,chapter:1,total:AI_CHAPTERS});if(my!==seq)return;game={...game,ai:true,slang:lang,aiTitle:d.title,cur:{text:d.text,choices:d.choices},summary:d.summary||"",done:!!d.end};if(game.done)game.log.push({text:d.text,choice:""});stopTick();busy=false;useAI();refreshNote();drawAI()}catch(e){if(my!==seq)return;stopTick();busy=false;drawGame();say("notice",UI.offline[lang])}}
function drawAI(){stopSpeak();const x=tr();say("chapter",x.chapter+" "+(game.step+1));say("title",game.aiTitle);let t=game.cur.text;if(game.done)t+="\n\n"+x.end;say("story",t);const box=$("choices");box.innerHTML="";if(!game.done)game.cur.choices.forEach(c=>{const b=document.createElement("button");b.className="choice";b.textContent="✦ "+c;b.disabled=busy;b.onclick=()=>chooseAI(c);box.appendChild(b)});if(!busy)say("notice","")}
async function chooseAI(c){if(game.lib)return chooseLib(c);if(busy)return;busy=true;drawAI();startTick(NEXT[lang],"notice");const my=seq;try{const d=await ask({lang:game.slang,hero:game.hero,world:game.world,chapter:game.step+2,total:AI_CHAPTERS,summary:game.summary||"",choice:c});if(my!==seq)return;game.log.push({text:game.cur.text,choice:c});game.step++;game.cur={text:d.text,choices:d.choices};game.summary=d.summary||game.summary;if(d.end||game.step>=AI_CHAPTERS-1){game.done=true;game.log.push({text:d.text,choice:""})}stopTick();busy=false;drawAI()}catch(e){if(my!==seq)return;stopTick();busy=false;drawAI();say("notice",UI.fail[lang])}}

function tr(){return langs[lang]}function say(id,v){$(id).textContent=v}
function getSaves(){try{let a=JSON.parse(localStorage.getItem(key)||"[]");return Array.isArray(a)?a.filter(v=>v&&typeof v.id==="string"&&typeof v.hero==="string"&&Number.isInteger(v.world)&&v.world>=0&&v.world<5&&Number.isInteger(v.step)&&v.step>=0&&v.step<=9&&Array.isArray(v.log)&&(!v.ai||(v.cur&&typeof v.cur.text==="string"&&Array.isArray(v.cur.choices)&&typeof v.aiTitle==="string"))):[]}catch(e){return []}}
function setSaves(v){try{localStorage.setItem(key,JSON.stringify(v));return true}catch(e){return false}}
function apply(){let x=tr();document.documentElement.lang=lang;for(let [id,k] of [["tag","tag"],["languageLabel","language"],["createTitle","createTitle"],["heroLabel","hero"],["worldLabel","world"],["create","create"],["note","note"],["libraryTitle","library"],["hint","hint"],["new","new"],["save","save"],["restart","restart"],["footer","footer"]])say(id,x[k]);[...$("world").options].forEach((o,i)=>o.textContent=x.worlds[i]);refreshNote();refreshListen();drawSaves();relocLib();if(game)drawGame()}
function newGame(){let hero=$("hero").value.trim();if(!hero){say("setupNotice",tr().need);$("hero").focus();return}say("setupNotice","");begin(hero,+$("world").selectedIndex,String(Date.now()));$("game").scrollIntoView({behavior:"smooth"})}
function scene(i){return pk().scenes[game.world][i]}

function ac(){try{if(!AC){const C=typeof window!=="undefined"&&(window.AudioContext||window.webkitAudioContext);if(!C)return null;AC=new C();mGain=AC.createGain();mGain.gain.value=0;const dl=AC.createDelay(1),fb=AC.createGain();dl.delayTime.value=.33;fb.gain.value=.35;dl.connect(fb);fb.connect(dl);mGain.connect(AC.destination);mGain.connect(dl);dl.connect(AC.destination)}if(AC.state==="suspended")AC.resume();return AC}catch(e){return null}}
